---
galaxy_info:
  author: nerdygriffin
  role_name: winbind_watchdog
  description: >-
    Systemd timer that detects and recovers hung or degraded winbind
    idmap_ad/trust state on AD member hosts (pkill -9 winbindd + kinit -k
    + restart), with trust and idmap probes.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: EL
      versions:
        - "8"
        - "9"
  galaxy_tags:
    - winbind
    - samba
    - activedirectory
    - ad
    - kerberos
    - systemd
    - watchdog

dependencies: []
